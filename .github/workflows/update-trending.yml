name: Update Trending
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Fetch GitHub trending
        run: node scripts/fetch-trending.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site
        run: npm run build
      - name: Commit and push updates
        run: |
          git config user.name 'vibecoding-bot'
          git config user.email 'bot@vibecoding.app'
          git add data/trending.json docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 自动更新趋势数据" && git push
